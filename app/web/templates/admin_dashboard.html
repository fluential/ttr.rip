{% extends "base.html" %}

{% block content %}
<hgroup>
    <h1>Admin Dashboard</h1>
    <h2>Manage all health checks below.</h2>
</hgroup>

<article>
    <header>New Check (Admin)</header>
    <form id="new-check-form">
        <div class="grid">
            <label for="name">
                Name
                <input type="text" id="name" name="name" placeholder="Daily Backup" required>
            </label>
            <label for="interval_seconds">
                Interval (seconds)
                <input type="number" id="interval_seconds" name="interval_seconds" placeholder="86400" required>
            </label>
        </div>
        <label for="grace_seconds">
            Grace (seconds)
            <input type="number" id="grace_seconds" name="grace_seconds" placeholder="300" required>
        </label>
        <button type="submit">Create Check</button>
    </form>
</article>

<article>
    <header>Overall Status</header>
    <div id="status-summary" class="grid">
        <div><h3 class="status-up">Up: 0</h3></div>
        <div><h3 class="status-down">Down: 0</h3></div>
        <div><h3 class="status-new">New: 0</h3></div>
    </div>
</article>

<article>
    <header>All Checks</header>
    <figure>
        <table role="grid" id="checks-table">
            <thead>
                <tr>
                    <th scope="col">Status</th>
                    <th scope="col">Name</th>
                    <th scope="col">Owner</th>
                    <th scope="col">Ping URLs</th>
                    <th scope="col">Last Ping</th>
                    <th scope="col">Expires in</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="7">Loading...</td></tr>
            </tbody>
        </table>
    </figure>
</article>

<script>
    const apiToken = "{{ api_token }}";

    function parseUTCDate(dateString) {
        if (!dateString) return null;
        // If timezone info (Z or +/-hh:mm) is missing, treat the string as UTC.
        // This corrects for browsers interpreting naive ISO-like strings as local time.
        if (!/Z|[+-]\d{2}:\d{2}$/.test(dateString)) {
            return new Date(dateString.replace(' ', 'T') + 'Z');
        }
        return new Date(dateString);
    }

    function formatTimeDifference(seconds) {
        if (isNaN(seconds)) return 'N/A';

        const isPast = seconds < 0;
        seconds = Math.abs(seconds);

        if (seconds < 1) {
            return isPast ? '0s ago' : 'in 0s';
        }

        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);

        const parts = [];
        if (hours > 0) {
            parts.push(`${hours}h`);
        }
        if (minutes > 0) {
            parts.push(`${minutes}m`);
        }
        if (secs > 0 || parts.length === 0) {
            parts.push(`${secs}s`);
        }

        const result = parts.join(' ');

        return isPast ? `${result} ago` : `in ${result}`;
    }

    async function fetchChecks() {
        const response = await fetch('/api/v1/checks', {
            headers: { 'Authorization': `Bearer ${apiToken}` }
        });
        const checks = await response.json();
        const tableBody = document.querySelector('#checks-table tbody');
        const statusSummary = document.getElementById('status-summary');

        tableBody.innerHTML = '';
        const statusCounts = { up: 0, down: 0, new: 0 };

        if (checks.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7">No checks found.</td></tr>';
            if (statusSummary) {
                statusSummary.querySelector('.status-up').textContent = `Up: 0`;
                statusSummary.querySelector('.status-down').textContent = `Down: 0`;
                statusSummary.querySelector('.status-new').textContent = `New: 0`;
            }
            return;
        }

        checks.forEach(check => {
            const row = document.createElement('tr');
            const lastPing = check.last_ping ? parseUTCDate(check.last_ping).toLocaleString() : 'Never';
            const pingUrl = `${window.location.origin}/ping/${check.uuid}`;
            const owner = check.owner_key || `admin (id: ${check.owner_id})`;

            const pingUrlsHtml = `
                <details role="list" style="margin-bottom: 0;">
                    <summary aria-haspopup="listbox" style="padding: 0.25rem 0.5rem; margin-bottom: 0;">URLs</summary>
                    <ul role="listbox" style="margin: 0; padding: 0.5rem; background-color: var(--pico-card-background-color); border: 1px solid var(--pico-card-border-color); border-radius: var(--pico-border-radius);">
                        <li><small>Success:</small><input type="text" value="${pingUrl}" readonly onclick="this.select()" style="cursor: pointer; height: 2rem; margin-bottom: 0.25rem;"></li>
                        <li><small>Start:</small><input type="text" value="${pingUrl}/start" readonly onclick="this.select()" style="cursor: pointer; height: 2rem; margin-bottom: 0.25rem;"></li>
                        <li><small>Fail:</small><input type="text" value="${pingUrl}/fail" readonly onclick="this.select()" style="cursor: pointer; height: 2rem; margin-bottom: 0;"></li>
                    </ul>
                </details>
            `;

            const referenceTime = parseUTCDate(check.last_ping) || parseUTCDate(check.created_at);
            const deadline = new Date(referenceTime.getTime() + (check.interval_seconds + check.grace_seconds) * 1000);
            const now = new Date();
            const diffSeconds = (deadline - now) / 1000;
            const expiresIn = formatTimeDifference(diffSeconds);

            let currentStatus = check.status;
            // If the check is not already marked as down, and the deadline has passed,
            // update the status on the frontend for immediate feedback.
            if (currentStatus !== 'down' && diffSeconds < 0) {
                currentStatus = 'down';
            }

            if (currentStatus === 'up') statusCounts.up++;
            else if (currentStatus === 'down') statusCounts.down++;
            else if (currentStatus === 'new') statusCounts.new++;

            const statusIcon = {
                'up': '🟢',
                'down': '🔴',
                'new': '🟡'
            }[currentStatus] || '⚪️';

            row.innerHTML = `
                <td><span class="status-${currentStatus}" title="${currentStatus.toUpperCase()}">${statusIcon} ${currentStatus.toUpperCase()}</span></td>
                <td>${check.name}</td>
                <td><small>${owner}</small></td>
                <td>${pingUrlsHtml}</td>
                <td>${lastPing}</td>
                <td>${expiresIn}</td>
                <td>
                    <div class="grid" style="margin-bottom: 0; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                        <button class="outline" onclick="editCheck(event, ${check.id}, '${check.name.replace(/'/g, "\\'")}', ${check.interval_seconds}, ${check.grace_seconds})">Edit</button>
                        <button class="secondary outline" onclick="deleteCheck(${check.id})">Delete</button>
                    </div>
                </td>
            `;
            tableBody.appendChild(row);
        });

        if (statusSummary) {
            statusSummary.querySelector('.status-up').textContent = `Up: ${statusCounts.up}`;
            statusSummary.querySelector('.status-down').textContent = `Down: ${statusCounts.down}`;
            statusSummary.querySelector('.status-new').textContent = `New: ${statusCounts.new}`;
        }
    }

    function editCheck(event, id, name, interval, grace) {
        event.stopPropagation();
        const form = document.getElementById('new-check-form');
        form.querySelector('#name').value = name;
        form.querySelector('#interval_seconds').value = interval;
        form.querySelector('#grace_seconds').value = grace;
        
        form.dataset.editingId = id;

        form.parentElement.querySelector('header').textContent = 'Edit Check';
        form.querySelector('button[type="submit"]').textContent = 'Update Check';
        
        let cancelButton = form.querySelector('.cancel-edit');
        if (!cancelButton) {
            cancelButton = document.createElement('button');
            cancelButton.type = 'button';
            cancelButton.className = 'secondary outline cancel-edit';
            cancelButton.textContent = 'Cancel';
            cancelButton.style.marginLeft = '1rem';
            cancelButton.onclick = cancelEdit;
            form.querySelector('button[type="submit"]').insertAdjacentElement('afterend', cancelButton);
        }
        form.scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEdit() {
        const form = document.getElementById('new-check-form');
        form.reset();
        delete form.dataset.editingId;

        form.parentElement.querySelector('header').textContent = 'New Check (Admin)';
        form.querySelector('button[type="submit"]').textContent = 'Create Check';
        
        const cancelButton = form.querySelector('.cancel-edit');
        if (cancelButton) {
            cancelButton.remove();
        }
    }

    async function handleFormSubmit(event) {
        event.preventDefault();
        const form = event.target;
        const editingId = form.dataset.editingId;

        const data = {
            name: form.querySelector('#name').value,
            interval_seconds: parseInt(form.querySelector('#interval_seconds').value),
            grace_seconds: parseInt(form.querySelector('#grace_seconds').value)
        };

        const headers = {
            'Authorization': `Bearer ${apiToken}`,
            'Content-Type': 'application/json'
        };

        let response;
        if (editingId) {
            response = await fetch(`/api/v1/checks/${editingId}`, {
                method: 'PUT',
                headers: headers,
                body: JSON.stringify(data)
            });
        } else {
            response = await fetch('/api/v1/checks', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(data)
            });
        }

        if (response.ok) {
            cancelEdit();
            fetchChecks();
        } else {
            alert(`Failed to ${editingId ? 'update' : 'create'} check.`);
        }
    }

    async function deleteCheck(checkId) {
        if (!confirm('Are you sure you want to delete this check?')) return;

        const response = await fetch(`/api/v1/checks/${checkId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${apiToken}` }
        });

        if (response.ok) {
            fetchChecks();
        } else {
            alert('Failed to delete check.');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchChecks();
        document.getElementById('new-check-form').addEventListener('submit', handleFormSubmit);
    });
</script>
<style>
    .status-up { color: var(--pico-color-green-500); font-weight: bold; }
    .status-down { color: var(--pico-color-red-500); font-weight: bold; }
    .status-new { color: var(--pico-color-gray-500); font-weight: bold; }
</style>
{% endblock %}
