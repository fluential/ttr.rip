{% extends "base.html" %}

{% block content %}
<hgroup>
    <h1>Admin Dashboard</h1>
    <h2>Manage all health checks below.</h2>
</hgroup>

<article>
    <header>System Status</header>
    <div id="system-status-summary">
        <p>Loading system status...</p>
    </div>
</article>

<article>
    <header>Overall Status</header>
    <div id="status-summary" class="grid">
        <div><h3 class="status-up">Up: 0</h3></div>
        <div><h3 class="status-down">Down: 0</h3></div>
        <div><h3 class="status-new">New: 0</h3></div>
    </div>
</article>

<article>
    <header>All Checks</header>
    <div class="refresh-controls" style="margin-bottom: 1rem; text-align: right;">
        <div class="refresh-buttons-container">
            <button id="refresh-toggle-btn" class="outline" title="Pause automatic refresh">⏸️</button>
            <button id="manual-refresh-btn" class="outline" title="Refresh now">🔄</button>
            <span id="refresh-status">Auto-refresh: <span id="refresh-countdown">5</span>s</span>
        </div>
    </div>
    <figure>
        <table role="grid" id="checks-table">
            <thead>
                <tr>
                    <th scope="col" data-sort="status">Status</th>
                    <th scope="col" data-sort="name">Name</th>
                    <th scope="col">Owner</th>
                    <th scope="col" data-sort="uuid">Ping URL</th>
                    <th scope="col" data-sort="last_ping">Last Ping</th>
                    <th scope="col" data-sort="last_duration_seconds">Last Duration</th>
                    <th scope="col" data-sort="expires_at">Expires in</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="8">Loading...</td></tr>
            </tbody>
        </table>
    </figure>
    <nav id="pagination-controls" aria-label="pagination" style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
        <ul>
            <li><button id="prev-page" class="secondary outline" disabled>Previous</button></li>
        </ul>
        <ul>
            <li>
                <select id="page-size" style="width: auto; display: inline-block; margin-bottom: 0;">
                    <option value="10">10</option>
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </li>
        </ul>
        <ul>
            <li><button id="next-page" class="secondary outline" disabled>Next</button></li>
        </ul>
    </nav>
</article>

<details id="new-check-section">
    <summary>New Check (Admin)</summary>
    <form id="new-check-form" style="margin-top: 1.5rem;">
        <div class="grid">
            <label for="name">
                Name
                <input type="text" id="name" name="name" placeholder="Daily Backup" required>
            </label>
            <label for="interval_seconds">
                Interval (seconds)
                <input type="number" id="interval_seconds" name="interval_seconds" placeholder="86400" required>
            </label>
        </div>
        <label for="grace_seconds">
            Grace (seconds)
            <input type="number" id="grace_seconds" name="grace_seconds" placeholder="300" required>
        </label>
        <button type="submit">Create Check</button>
    </form>
</details>

<script>
    window.API_TOKEN = "{{ api_token }}";
    window.CSRF_TOKEN = "{{ csrf_token }}";
</script>
<script src="/static/js/admin_dashboard.js" defer></script>
{% endblock %}
