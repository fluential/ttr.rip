{% extends "base.html" %}

{% block content %}
<hgroup>
    <h1>Dashboard</h1>
    <h2>Manage your health checks below.</h2>
</hgroup>

<article>
    <header>New Check</header>
    <form id="new-check-form">
        <div class="grid">
            <label for="name">
                Name
                <input type="text" id="name" name="name" placeholder="Daily Backup" required>
            </label>
            <label for="interval_seconds">
                Interval (seconds)
                <input type="number" id="interval_seconds" name="interval_seconds" placeholder="86400" required>
            </label>
        </div>
        <label for="grace_seconds">
            Grace (seconds)
            <input type="number" id="grace_seconds" name="grace_seconds" placeholder="300" required>
        </label>
        <button type="submit">Create Check</button>
    </form>
</article>

<article>
    <header>Current Checks</header>
    <figure>
        <table role="grid" id="checks-table">
            <thead>
                <tr>
                    <th scope="col">Status</th>
                    <th scope="col">Name</th>
                    <th scope="col">Ping URL</th>
                    <th scope="col">Last Ping</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="5">Loading...</td></tr>
            </tbody>
        </table>
    </figure>
</article>

<script>
    let apiToken = null;

    async function loginAndGetToken() {
        const response = await fetch('/api/v1/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                'username': 'admin',
                'password': 'password'
            })
        });
        if (!response.ok) {
            console.error('Failed to login for API token');
            window.location.href = '/login';
            return null;
        }
        const data = await response.json();
        return data.access_token;
    }

    async function fetchChecks() {
        if (!apiToken) return;
        const response = await fetch('/api/v1/checks', {
            headers: { 'Authorization': `Bearer ${apiToken}` }
        });
        const checks = await response.json();
        const tableBody = document.querySelector('#checks-table tbody');
        tableBody.innerHTML = '';

        if (checks.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5">No checks found. Create one above!</td></tr>';
            return;
        }

        checks.forEach(check => {
            const row = document.createElement('tr');
            const lastPing = check.last_ping ? new Date(check.last_ping).toLocaleString() : 'Never';
            const pingUrl = `${window.location.origin}/ping/${check.uuid}`;
            const statusIcon = {
                'up': '🟢',
                'down': '🔴',
                'new': '🟡'
            }[check.status] || '⚪️';

            row.innerHTML = `
                <td><span class="status-${check.status}" title="${check.status.toUpperCase()}">${statusIcon} ${check.status.toUpperCase()}</span></td>
                <td>${check.name}</td>
                <td><input type="text" value="${pingUrl}" readonly onclick="this.select()" style="cursor: pointer;"></td>
                <td>${lastPing}</td>
                <td><button class="secondary outline" onclick="deleteCheck(${check.id})">Delete</button></td>
            `;
            tableBody.appendChild(row);
        });
    }

    async function createCheck(event) {
        event.preventDefault();
        if (!apiToken) return;
        const formData = new FormData(event.target);
        const data = {
            name: formData.get('name'),
            interval_seconds: parseInt(formData.get('interval_seconds')),
            grace_seconds: parseInt(formData.get('grace_seconds'))
        };

        const response = await fetch('/api/v1/checks', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            event.target.reset();
            fetchChecks();
        } else {
            alert('Failed to create check.');
        }
    }

    async function deleteCheck(checkId) {
        if (!apiToken) return;
        if (!confirm('Are you sure you want to delete this check?')) return;

        const response = await fetch(`/api/v1/checks/${checkId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${apiToken}` }
        });

        if (response.ok) {
            fetchChecks();
        } else {
            alert('Failed to delete check.');
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        apiToken = await loginAndGetToken();
        if (apiToken) {
            fetchChecks();
        }
        document.getElementById('new-check-form').addEventListener('submit', createCheck);
    });
</script>
<style>
    .status-up { color: var(--pico-color-green-500); font-weight: bold; }
    .status-down { color: var(--pico-color-red-500); font-weight: bold; }
    .status-new { color: var(--pico-color-gray-500); font-weight: bold; }
</style>
{% endblock %}
