# A generic Alembic configuration file.

[alembic]
# path to migration scripts
script_location = alembic

# template for new migration scripts
file_template = %%(rev)s_%%(slug)s

# timezone for revision files
timezone = UTC

# the file encoding used to write migration files
# output_encoding = utf-8

# sqlalchemy.url will be set dynamically from env.py
# using your application's settings.
sqlalchemy.url = postgresql://user:password@host/dbname


[post_write_hooks]
# This hook is used to format the generated migration files with black.
# You can install it with: pip install black
# hooks = black
# black.type = exec
# black.entrypoint = black
# black.options = -l 79 %%(path)s


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
