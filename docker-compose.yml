version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ttl_rip_db
    environment:
      - POSTGRES_USER=ttlrip
      - POSTGRES_PASSWORD=ttlrip
      - POSTGRES_DB=ttlrip
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttlrip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ttl_rip_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data

  migrate:
    build: .
    container_name: ttl_rip_migrate
    command: python -m alembic upgrade head
    volumes:
      - ./app:/app/app
    env_file:
      - .env.example
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    container_name: ttl_rip_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    env_file:
      - .env.example
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - UVICORN_LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: ttl_rip_caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      web:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ttl_rip_cloudflared
    restart: unless-stopped
    #depends_on:
    #  caddy:
    #    condition: service_healthy
    env_file:
      - .env.example
    environment:
      - CLOUDFLARED_URL=http://caddy:8080
      - CLOUDFLARED_OPTS=
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      token="${CLOUDFLARED_TOKEN:-${CLOUDFLARE_TUNNEL_TOKEN:-}}";
      if [ -n "$token" ]; then
        echo "Starting Cloudflare Tunnel with named token";
        exec cloudflared tunnel run --no-autoupdate --token "$token" ${CLOUDFLARED_OPTS:-};
      else
        echo "No tunnel token provided. Starting Quick Tunnel to ${CLOUDFLARED_URL:-http://caddy:8080}";
        exec cloudflared tunnel --no-autoupdate --url "${CLOUDFLARED_URL:-http://caddy:8080}" ${CLOUDFLARED_OPTS:-};
      fi

  worker:
    build: .
    container_name: ttl_rip_worker
    command: sh -lc 'if [ "${EMBED_BEAT:-0}" = "1" ]; then celery -A app.worker.celery_app worker --loglevel=info -P solo -B; else celery -A app.worker.celery_app worker --loglevel=info -P solo; fi'
    volumes:
      - ./app:/app/app
    env_file:
      - .env.example
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - CELERY_WORKER_HIJACK_ROOT_LOGGER=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  beat:
    build: .
    container_name: ttl_rip_beat
    command: sh -lc 'if [ "${EMBED_BEAT:-0}" = "1" ]; then echo "Beat embedded in worker; exiting."; exit 0; else celery -A app.worker.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule; fi'
    volumes:
      - ./app:/app/app
    env_file:
      - .env.example
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
