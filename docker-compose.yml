version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ttl_rip_db
    environment:
      - POSTGRES_USER=ttlrip
      - POSTGRES_PASSWORD=ttlrip
      - POSTGRES_DB=ttlrip
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttlrip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ttl_rip_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data

  migrate:
    build: .
    container_name: ttl_rip_migrate
    command: alembic upgrade head
    volumes:
      - ./app:/app/app
    env_file:
      - .env.example
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    container_name: ttl_rip_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - ./app:/app/app
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    env_file:
      - .env.example
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - UVICORN_LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: ttl_rip_caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "8080:8080"
    depends_on:
      web:
        condition: service_healthy

  worker:
    build: .
    container_name: ttl_rip_worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./app:/app/app
    env_file:
      - .env.example
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - CELERY_WORKER_HIJACK_ROOT_LOGGER=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  beat:
    build: .
    container_name: ttl_rip_beat
    command: celery -A app.worker.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    volumes:
      - ./app:/app/app
    env_file:
      - .env.example
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - CELERY_WORKER_HIJACK_ROOT_LOGGER=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
