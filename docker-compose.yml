version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ttl_rip_db
    environment:
      - POSTGRES_USER=ttlrip
      - POSTGRES_PASSWORD=ttlrip
      - POSTGRES_DB=ttlrip
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttlrip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ttl_rip_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: ttl_rip_web
    command: ./start-with-caddy.sh
    volumes:
      - ./app:/app/app
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: ttl_rip_worker
    command: bash -c 'for i in $(seq 1 30); do alembic upgrade head && ok=1 && break || sleep 2; done; if [ -z "$ok" ]; then echo "Migrations failed"; exit 1; fi; celery -A app.worker.celery_app worker --loglevel=info --pool=threads -c 50'
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
      - web

  beat:
    build: .
    container_name: ttl_rip_beat
    command: bash -c 'for i in $(seq 1 30); do alembic upgrade head && ok=1 && break || sleep 2; done; if [ -z "$ok" ]; then echo "Migrations failed"; exit 1; fi; celery -A app.worker.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule'
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
      - web

volumes:
  postgres_data:
  redis_data:
